name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test -- --passWithNoTests
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://lgjviajyztekqnhjxfrl.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9qCcNewrU4e1DV7dK0zm7A_BUEMUTO2
        run: npm run build
